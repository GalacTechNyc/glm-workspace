<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GLM Workspace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Source+Serif+4:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<style>
:root {
  --accent: #6d5dfc;
  --font-size: 15px;
  --chat-width: 820px;
  --font: 'Inter', system-ui, -apple-system, sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, monospace;
  --radius: 14px;
  --bg: #f7f7f8; --panel: #ffffff; --panel-2: #f0f0f3; --border: #e3e3e8;
  --text: #1b1b1f; --muted: #6b6b76; --user-bubble: color-mix(in srgb, var(--accent) 12%, var(--panel));
  --code-bg: #0f1117; --danger: #d9304f; --ok: #1f9d55;
}
:root[data-theme="dark"] {
  --bg: #0e0f13; --panel: #16171d; --panel-2: #1e2028; --border: #2a2c36;
  --text: #ececf1; --muted: #9a9aa8; --user-bubble: color-mix(in srgb, var(--accent) 22%, var(--panel));
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e0f13; --panel: #16171d; --panel-2: #1e2028; --border: #2a2c36;
    --text: #ececf1; --muted: #9a9aa8; --user-bubble: color-mix(in srgb, var(--accent) 22%, var(--panel));
  }
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--text); font-family: var(--font); font-size: var(--font-size); line-height: 1.55; overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
.app { display: grid; grid-template-columns: 260px 1fr auto; height: 100vh; }
.app.no-sidebar { grid-template-columns: 0 1fr auto; }
.app.no-sidebar .sidebar { display: none; }

/* sidebar */
.sidebar { background: var(--panel); border-right: 1px solid var(--border); display: flex; flex-direction: column; min-width: 0; }
.sidebar .top { padding: 14px; display: flex; flex-direction: column; gap: 10px; border-bottom: 1px solid var(--border); }
.brand { display: flex; align-items: center; gap: 8px; font-weight: 600; }
.brand .dot { width: 22px; height: 22px; border-radius: 7px; background: var(--accent); display: grid; place-items: center; color: #fff; font-size: 12px; }
.btn { border: 1px solid var(--border); background: var(--panel); border-radius: 10px; padding: 7px 12px; transition: background .15s, border-color .15s; }
.btn:hover { background: var(--panel-2); }
.btn.primary { background: var(--accent); color: #fff; border-color: transparent; }
.btn.primary:hover { filter: brightness(1.08); }
.btn.sm { padding: 4px 9px; font-size: .85em; border-radius: 8px; }
.btn.danger { color: var(--danger); }
.icon-btn { border: 0; background: transparent; padding: 6px; border-radius: 8px; color: var(--muted); display: inline-grid; place-items: center; }
.icon-btn:hover { background: var(--panel-2); color: var(--text); }
.search { width: 100%; padding: 7px 10px; border-radius: 9px; border: 1px solid var(--border); background: var(--bg); }
.chat-list { flex: 1; overflow-y: auto; padding: 8px; }
.chat-item { display: flex; align-items: center; gap: 6px; padding: 8px 10px; border-radius: 9px; cursor: pointer; color: var(--muted); }
.chat-item:hover { background: var(--panel-2); color: var(--text); }
.chat-item.active { background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--text); }
.chat-item .t { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: .92em; }
.chat-item .icon-btn { opacity: 0; padding: 3px; }
.chat-item:hover .icon-btn { opacity: 1; }
.sidebar .bottom { padding: 10px; border-top: 1px solid var(--border); display: flex; gap: 6px; flex-wrap: wrap; }

/* main */
.main { display: flex; flex-direction: column; min-width: 0; height: 100vh; }
.header { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 1px solid var(--border); background: var(--panel); }
.header .title { font-weight: 600; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: text; }
.pill-select { border: 1px solid var(--border); background: var(--bg); border-radius: 9px; padding: 6px 8px; }
.toggle-chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--border); border-radius: 999px; padding: 4px 10px; font-size: .85em; cursor: pointer; user-select: none; color: var(--muted); }
.toggle-chip.on { border-color: var(--accent); color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, transparent); }
.messages { flex: 1; overflow-y: auto; padding: 24px 16px 40px; scroll-behavior: smooth; }
.messages-inner { max-width: var(--chat-width); margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
.empty { text-align: center; color: var(--muted); margin-top: 12vh; }
.empty h2 { color: var(--text); margin-bottom: 6px; font-weight: 600; }
.starters { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; margin-top: 24px; text-align: left; }
.starter { border: 1px solid var(--border); background: var(--panel); border-radius: 12px; padding: 12px 14px; cursor: pointer; font-size: .92em; }
.starter:hover { border-color: var(--accent); }
.starter b { display: block; margin-bottom: 2px; }

.msg { display: flex; flex-direction: column; gap: 4px; }
.msg.user { align-items: flex-end; }
.msg .bubble { max-width: 100%; }
.msg.user .bubble { background: var(--user-bubble); padding: 10px 14px; border-radius: var(--radius); max-width: 85%; white-space: pre-wrap; word-wrap: break-word; }
.msg.assistant .bubble { width: 100%; }
body.bubbles .msg.assistant .bubble { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 16px; }
.msg .actions { display: flex; gap: 2px; opacity: 0; transition: opacity .15s; align-items: center; flex-wrap: wrap; }
.msg:hover .actions, .msg.last .actions { opacity: 1; }
.meta { font-size: .78em; color: var(--muted); margin-left: 6px; font-variant-numeric: tabular-nums; }
.role-label { font-size: .78em; color: var(--muted); font-weight: 500; }

.md > :first-child { margin-top: 0; } .md > :last-child { margin-bottom: 0; }
.md p { margin: .6em 0; }
.md pre { position: relative; background: var(--code-bg); color: #e6e6e6; padding: 14px; border-radius: 10px; overflow-x: auto; font-size: .88em; }
.md code { font-family: var(--mono); font-size: .9em; }
.md :not(pre) > code { background: var(--panel-2); padding: 1px 5px; border-radius: 5px; }
.md pre code.hljs { background: transparent; padding: 0; }
.md table { border-collapse: collapse; margin: .8em 0; display: block; overflow-x: auto; }
.md th, .md td { border: 1px solid var(--border); padding: 6px 10px; }
.md blockquote { border-left: 3px solid var(--accent); margin: .6em 0; padding: 2px 12px; color: var(--muted); }
.md a { color: var(--accent); }
.copy-code { position: absolute; top: 8px; right: 8px; font-size: 11px; padding: 3px 8px; border-radius: 6px; border: 1px solid #333; background: #1c1f27; color: #ccc; opacity: 0; }
.md pre:hover .copy-code { opacity: 1; }
.code-lang { position: absolute; top: 8px; left: 14px; font-size: 10px; color: #888; text-transform: uppercase; letter-spacing: .05em; }
.md pre.has-lang { padding-top: 28px; }

details.reasoning { border: 1px solid var(--border); border-radius: 10px; margin-bottom: 10px; background: var(--panel-2); }
details.reasoning summary { cursor: pointer; padding: 7px 12px; font-size: .85em; color: var(--muted); user-select: none; }
details.reasoning .md { padding: 0 14px 10px; font-size: .9em; color: var(--muted); max-height: 420px; overflow-y: auto; }
.tool-card { border: 1px solid var(--border); border-radius: 10px; margin: 8px 0; overflow: hidden; font-size: .88em; }
.tool-card .head { display: flex; gap: 8px; align-items: center; padding: 7px 12px; background: var(--panel-2); font-family: var(--mono); }
.tool-card pre { margin: 0; padding: 10px 12px; white-space: pre-wrap; word-break: break-word; font-family: var(--mono); font-size: .92em; max-height: 300px; overflow: auto; }
.tool-card .pending-actions { padding: 8px 12px; display: flex; gap: 6px; border-top: 1px solid var(--border); }
.search-card summary { cursor: pointer; list-style: none; }
.search-card summary::-webkit-details-marker { display: none; }
.sr-list { margin: 0; padding: 8px 14px 10px 34px; display: flex; flex-direction: column; gap: 8px; font-family: var(--font); }
.sr-list a { color: var(--accent); text-decoration: none; font-weight: 500; }
.sr-list a:hover { text-decoration: underline; }
.sr-site { color: var(--muted); font-size: .85em; margin-left: 6px; }
.sr-snip { color: var(--muted); font-size: .92em; margin-top: 2px; }
.file-links { padding: 8px 12px; border-bottom: 1px solid var(--border); font-size: .92em; line-height: 1.8; }
.file-links a { color: var(--accent); text-decoration: none; }
.file-links video.shot { display: block; max-width: 100%; max-height: 480px; border-radius: 8px; border: 1px solid var(--border); margin-top: 6px; background: #000; }
.file-links img.shot.gen { max-height: 480px; object-fit: contain; background: var(--panel-2); }
.file-links img.shot { max-width: 100%; max-height: 260px; border-radius: 8px; border: 1px solid var(--border); margin-top: 6px; display: block; object-fit: cover; object-position: top; }
.file-row { display: flex; align-items: center; gap: 6px; padding: 4px 6px; border-radius: 7px; font-size: .86em; }
.file-row:hover { background: var(--panel-2); }
.file-row .fname { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.file-row .fname a { color: var(--text); text-decoration: none; }
.file-row .fname a:hover { color: var(--accent); }
.file-row .icon-btn { padding: 2px 5px; font-size: .95em; text-decoration: none; }
.auto-bar { max-width: var(--chat-width); margin: 0 auto 8px; display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 12px;
  border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent); background: color-mix(in srgb, var(--accent) 9%, var(--panel)); font-size: .88em; flex-wrap: wrap; }
.auto-bar[hidden] { display: none; }
.auto-bar .spacer { flex: 1; }
.auto-bar .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); animation: pulse 1.4s ease-in-out infinite; }
.auto-bar.paused .dot { animation: none; background: var(--muted); }
@keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .35; transform: scale(.7); } }
.msg.auto-tick { align-items: center; }
.tick { font-size: .78em; color: var(--muted); border: 1px dashed var(--border); border-radius: 999px; padding: 3px 12px; max-width: 90%; text-align: center; }
.tick.end { border-style: solid; color: var(--text); }
.auto-form { padding: 14px 16px; overflow-y: auto; }
.auto-form .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; }
.auto-form label.f { display: block; font-size: .85em; font-weight: 500; margin-bottom: 12px; }
.auto-form label.f > span { display: block; margin-bottom: 5px; }
.auto-form input[type=number], .auto-form select, .auto-form textarea { width: 100%; padding: 7px 10px; border: 1px solid var(--border); border-radius: 9px; background: var(--bg); font-weight: 400; }
.auto-form textarea { resize: vertical; }
.auto-form .check { display: flex; gap: 8px; align-items: flex-start; font-size: .88em; margin: 8px 0; }
.auto-form .check small { display: block; color: var(--muted); }
.modal footer { padding: 12px 16px; border-top: 1px solid var(--border); display: flex; gap: 8px; justify-content: flex-end; align-items: center; }
.badge { font-size: .75em; padding: 1px 7px; border-radius: 999px; background: color-mix(in srgb, var(--accent) 15%, transparent); color: var(--accent); font-family: var(--font); }
.badge.ok { background: color-mix(in srgb, var(--ok) 15%, transparent); color: var(--ok); }
.badge.err { background: color-mix(in srgb, var(--danger) 15%, transparent); color: var(--danger); }
.error-box { border: 1px solid var(--danger); color: var(--danger); background: color-mix(in srgb, var(--danger) 8%, transparent); padding: 10px 14px; border-radius: 10px; font-size: .9em; white-space: pre-wrap; }
.cursor::after { content: '▍'; animation: blink 1s steps(2) infinite; color: var(--accent); }
@keyframes blink { 50% { opacity: 0; } }
.edit-area { width: 100%; min-height: 80px; border: 1px solid var(--accent); border-radius: 10px; padding: 10px; background: var(--panel); resize: vertical; }

/* composer */
.composer-wrap { padding: 10px 16px 16px; }
.composer { max-width: var(--chat-width); margin: 0 auto; border: 1px solid var(--border); background: var(--panel); border-radius: 18px; padding: 10px 12px; box-shadow: 0 2px 14px rgba(0,0,0,.05); }
.composer:focus-within { border-color: var(--accent); }
.composer.drop { border-color: var(--accent); border-style: dashed; background: color-mix(in srgb, var(--accent) 6%, var(--panel)); }
.composer textarea { width: 100%; border: 0; outline: 0; resize: none; background: transparent; max-height: 40vh; min-height: 26px; }
.composer .row { display: flex; align-items: center; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
.composer .spacer { flex: 1; }
.attachments { display: flex; gap: 6px; flex-wrap: wrap; }
.attachment { font-size: .8em; border: 1px solid var(--border); border-radius: 8px; padding: 3px 8px; display: inline-flex; gap: 6px; align-items: center; }
.send-btn { width: 36px; height: 36px; border-radius: 11px; border: 0; background: var(--accent); color: #fff; display: grid; place-items: center; }
.send-btn:disabled { opacity: .4; cursor: default; }
.send-btn.stop { background: var(--text); color: var(--bg); }
.hint { text-align: center; font-size: .75em; color: var(--muted); margin-top: 6px; }

/* settings panel */
.panel { width: 360px; background: var(--panel); border-left: 1px solid var(--border); display: flex; flex-direction: column; height: 100vh; }
.panel.hidden { display: none; }
.tabs { display: flex; gap: 2px; padding: 8px; border-bottom: 1px solid var(--border); }
.tab { flex: 1; border: 0; background: transparent; padding: 7px 4px; border-radius: 8px; color: var(--muted); font-size: .85em; }
.tab.active { background: var(--panel-2); color: var(--text); font-weight: 500; }
.panel-body { flex: 1; overflow-y: auto; padding: 14px 16px 30px; }
.field { margin-bottom: 16px; }
.field label, .field .lbl { display: flex; justify-content: space-between; font-size: .85em; font-weight: 500; margin-bottom: 6px; }
.field .lbl span:last-child, .field label span:last-child { color: var(--muted); font-weight: 400; font-variant-numeric: tabular-nums; }
.field .help { font-size: .76em; color: var(--muted); margin-top: 4px; }
.field input[type=text], .field input[type=number], .field select, .field textarea { width: 100%; padding: 7px 10px; border: 1px solid var(--border); border-radius: 9px; background: var(--bg); }
.field textarea { resize: vertical; font-family: var(--mono); font-size: .85em; }
.field textarea.prose { font-family: var(--font); font-size: .92em; }
input[type=range] { width: 100%; accent-color: var(--accent); }
input[type=checkbox] { accent-color: var(--accent); }
.switch-row { display: flex; align-items: center; justify-content: space-between; padding: 8px 0; border-bottom: 1px dashed var(--border); font-size: .9em; }
.switch-row small { display: block; color: var(--muted); font-size: .8em; }
.section-title { font-size: .72em; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 18px 0 8px; font-weight: 600; }
.tool-def { border: 1px solid var(--border); border-radius: 10px; padding: 10px; margin-bottom: 10px; }
.tool-def .row { display: flex; gap: 6px; align-items: center; margin-bottom: 6px; }
.tool-def input[type=text] { flex: 1; }
.tool-def textarea { min-height: 70px; margin-top: 6px; }
.preset-row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
.color-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.swatch { width: 26px; height: 26px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; }
.swatch.active { border-color: var(--text); }

/* modal */
.modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: grid; place-items: center; z-index: 50; padding: 16px; }
.modal { background: var(--panel); border-radius: 14px; width: min(760px, 100%); max-height: 85vh; display: flex; flex-direction: column; border: 1px solid var(--border); }
.modal header { padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; font-weight: 600; }
.modal pre { margin: 0; padding: 14px 16px; overflow: auto; font-family: var(--mono); font-size: .8em; white-space: pre-wrap; word-break: break-word; }
.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 8px 16px; border-radius: 10px; font-size: .88em; z-index: 60; }

@media (max-width: 900px) {
  .app, .app.no-sidebar { grid-template-columns: minmax(0, 1fr); }
  .sidebar { position: fixed; inset: 0 auto 0 0; width: 270px; z-index: 30; box-shadow: 4px 0 20px rgba(0,0,0,.2); }
  .panel { position: fixed; inset: 0 0 0 auto; width: min(360px, 100vw); z-index: 30; box-shadow: -4px 0 20px rgba(0,0,0,.2); }
  .header .hide-sm { display: none; }
}
</style>
<style id="custom-css"></style>
</head>
<body>
<div class="app" id="app">
  <aside class="sidebar">
    <div class="top">
      <div class="brand"><div class="dot">Z</div> GLM Workspace</div>
      <button class="btn primary" id="newChat">+ New chat <span style="opacity:.6;font-size:.8em">⌘K</span></button>
      <input class="search" id="search" placeholder="Search chats…">
    </div>
    <div class="chat-list" id="chatList"></div>
    <div class="bottom">
      <button class="btn sm" id="importBtn">Import</button>
      <button class="btn sm" id="exportAllBtn">Export all</button>
      <input type="file" id="importFile" accept=".json" hidden>
    </div>
  </aside>

  <main class="main">
    <div class="header">
      <button class="icon-btn" id="toggleSidebar" title="Toggle sidebar">☰</button>
      <div class="title" id="chatTitle" title="Click to rename">New chat</div>
      <select class="pill-select" id="modelQuick" title="Model"></select>
      <span class="toggle-chip hide-sm" id="thinkChip" title="Toggle deep thinking">🧠 Thinking</span>
      <span class="toggle-chip hide-sm" id="searchChip" title="Let the model search the web">🌐 Search</span>
      <span class="toggle-chip hide-sm" id="toolsChip" title="Toggle tool use">🔧 Tools</span>
      <span class="toggle-chip" id="autoChip" title="Let GLM run on its own">🤖 Autopilot</span>
      <button class="icon-btn" id="exportChat" title="Export chat as Markdown">⤓</button>
      <button class="icon-btn" id="togglePanel" title="Settings">⚙</button>
    </div>
    <div class="messages" id="messages"><div class="messages-inner" id="messagesInner"></div></div>
    <div class="composer-wrap">
      <div class="auto-bar" id="autoBar" hidden>
        <span class="dot"></span><b>Autopilot</b><span id="autoStatus" class="meta" style="margin:0"></span>
        <span class="spacer"></span>
        <button class="btn sm" id="autoPause">Pause</button>
        <button class="btn sm danger" id="autoStop">Stop</button>
      </div>
      <div class="composer">
        <div class="attachments" id="attachments"></div>
        <textarea id="input" rows="1" placeholder="Message GLM…"></textarea>
        <div class="row">
          <button class="icon-btn" id="attachBtn" title="Attach files (or drag and drop / paste)">📎</button>
          <input type="file" id="fileInput" multiple hidden>
          <span class="meta" id="statusLine"></span>
          <div class="spacer"></div>
          <span class="meta" id="tokenEstimate"></span>
          <button class="send-btn" id="sendBtn" title="Send">➤</button>
        </div>
      </div>
      <div class="hint" id="hint">Enter to send · Shift+Enter for newline</div>
    </div>
  </main>

  <aside class="panel" id="panel">
    <div class="tabs">
      <button class="tab active" data-tab="model">Model</button>
      <button class="tab" data-tab="system">System</button>
      <button class="tab" data-tab="tools">Tools</button>
      <button class="tab" data-tab="files">Files</button>
      <button class="tab" data-tab="memory">Memory</button>
      <button class="tab" data-tab="look">Look</button>
    </div>
    <div class="panel-body" id="panelBody"></div>
  </aside>
</div>

<script>
/* =========================================================
   Storage helpers
   ========================================================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { toast('Storage full — export & delete some chats'); } },
};
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const EXAMPLE_TOOL = {
  id: uid(), enabled: true, name: 'get_weather',
  description: 'Get the current weather for a city.',

/* ---------- persistent code runtime (Web Worker sessions, see runtime-worker.js) ---------- */
const RUNTIME = { sessions: new Map(), jobs: new Map(), seq: 0 };
const RPC_ALLOWED = new Set(['http_request', 'read_file', 'write_file', 'list_files']);
const OUTPUT_CAP = 400000;

function runtimeSession(name, lang) {
  const key = `${name}:${lang}`;
  let s = RUNTIME.sessions.get(key);
  if (s) return s;
  const worker = new Worker('/runtime-worker.js');
  s = { key, name, lang, worker, created: Date.now(), status: 'starting', runs: 0 };
  worker.onmessage = e => onRuntimeMessage(s, e.data);
  worker.onerror = e => { s.status = 'crashed'; s.error = e.message; };
  worker.postMessage({ type: 'init', lang });
  RUNTIME.sessions.set(key, s);
  return s;
}

async function onRuntimeMessage(s, m) {
  const job = m.jobId && RUNTIME.jobs.get(m.jobId);
  if (m.type === 'ready') s.status = 'ready';
  else if (m.type === 'init-error') { s.status = 'failed'; s.error = m.error; }
  else if (m.type === 'rpc') {
    // the worker can only reach these tools, and they go through the usual approvals / autopilot rules
    const result = RPC_ALLOWED.has(m.name) ? await guardedServerTool(m.name, m.args || {}) : { error: `Not available from the runtime: ${m.name}` };
    s.worker.postMessage({ type: 'rpc-result', rpcId: m.rpcId, result });
  } else if (job && m.type === 'started') { job.status = 'running'; job.started = Date.now(); }
  else if (job && m.type === 'log') {
    job.output += m.stream === 'stderr' ? m.text.replace(/^/gm, '[stderr] ').replace(/\[stderr\] $/, '') : m.text;
    if (job.output.length > OUTPUT_CAP) { const cut = job.output.length - OUTPUT_CAP; job.output = job.output.slice(cut); job.read = Math.max(0, job.read - cut); job.dropped = (job.dropped || 0) + cut; }
  } else if (job && m.type === 'result') {
    Object.assign(job, { status: m.ok ? 'done' : 'error', result: m.result, error: m.error, ms: m.ms, ended: Date.now() });
    job.waiters.splice(0).forEach(w => w());
  }
}

function jobReport(job, { full } = {}) {
  const fresh = job.output.slice(full ? 0 : job.read);
  job.read = job.output.length;
  const out = fresh.length > 50000 ? '…[' + (fresh.length - 50000) + ' earlier chars omitted]\n' + fresh.slice(-50000) : fresh;
  return {
    job_id: job.id, session: job.session, language: job.lang, status: job.status,
    ...(job.status === 'done' ? { result: job.result } : {}), ...(job.error ? { error: job.error } : {}),
    output: out, ...(job.dropped ? { note: `${job.dropped} chars of early output were dropped (output cap)` } : {}),
    elapsed_s: +(((job.ended || Date.now()) - (job.started || job.queued)) / 1000).toFixed(1),
    ...(['queued', 'running'].includes(job.status) ? { hint: 'Still running in the background. Check again with code_status.' } : {}),
  };
}

const waitJob = (job, ms) => ['done', 'error'].includes(job.status) ? Promise.resolve()
  : new Promise(r => { const t = setTimeout(r, ms); job.waiters.push(() => { clearTimeout(t); r(); }); });

function killSession(key) {
  const s = RUNTIME.sessions.get(key); if (!s) return false;
  s.worker.terminate(); RUNTIME.sessions.delete(key);
  for (const j of RUNTIME.jobs.values()) if (`${j.session}:${j.lang}` === key && ['queued', 'running'].includes(j.status)) {
    Object.assign(j, { status: 'error', error: 'Session was reset', ended: Date.now() }); j.waiters.splice(0).forEach(w => w());
  }
  return true;
}

/* ---------- vision: GLM 5.3 is text-only, so it looks at images through a vision model ---------- */
async function imageToDataUrl(blob, maxDim) {
  const url = URL.createObjectURL(blob);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error('Not an image format the browser can open')); i.src = url; });
    const ow = img.naturalWidth || 1024, oh = img.naturalHeight || 1024;
    const scale = Math.min(1, maxDim / Math.max(ow, oh));
    const w = Math.max(1, Math.round(ow * scale)), h = Math.max(1, Math.round(oh * scale));
    const c = document.createElement('canvas'); c.width = w; c.height = h;
    const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, h); ctx.drawImage(img, 0, 0, w, h);
    let data = c.toDataURL('image/png');
    if (data.length > 5e6) data = c.toDataURL('image/jpeg', 0.85); // keep the request a sane size
    return { data, width: w, height: h, original: `${ow}x${oh}` };
  } finally { URL.revokeObjectURL(url); }
}

async function askVision(model, dataUrl, question) {
  const r = await api('/api/chat', {
    model, stream: false, max_tokens: 4096,
    messages: [{ role: 'user', content: [{ type: 'image_url', image_url: { url: dataUrl } }, { type: 'text', text: question }] }],
  }, { 'X-Endpoint': S.endpoint });
  const j = await r.json().catch(() => ({ error: { message: `HTTP ${r.status}` } }));
  if (j.error || !r.ok) throw new Error(`${j.error?.code ? '[' + j.error.code + '] ' : ''}${j.error?.message || 'HTTP ' + r.status}`);
  return (j.choices?.[0]?.message?.content || '').trim();
}

/* ---------- ears: decode any audio/video in the browser, then transcribe or listen via OpenAI ---------- */
const hms = sec => { sec = Math.max(0, Math.round(sec)); const h = Math.floor(sec / 3600), m = Math.floor(sec / 60) % 60, x = sec % 60; return (h ? h + ':' + String(m).padStart(2, '0') : m) + ':' + String(x).padStart(2, '0'); };

async function decodeAudioFile(path, sampleRate) {
  const res = await fetch(fileUrl(String(path || '').replace(/^\/+/, '')));
  if (!res.ok) throw new Error(`Couldn't open ${path}. Check the path with list_files.`);
  const ctx = new OfflineAudioContext(1, 1, sampleRate); // decoding here resamples to sampleRate
  let buf;
  try { buf = await ctx.decodeAudioData(await res.arrayBuffer()); }
  catch { throw new Error(`${path}: no audio track the browser can decode`); }
  if (buf.duration > 7200) throw new Error(`${path} is ${hms(buf.duration)} long; 2 hours is the max`);
  const mono = new Float32Array(buf.length);
  for (let ch = 0; ch < buf.numberOfChannels; ch++) {
    const d = buf.getChannelData(ch);
    for (let i = 0; i < d.length; i++) mono[i] += d[i] / buf.numberOfChannels;
  }
  return { samples: mono, rate: buf.sampleRate, duration: buf.duration };
}

function wavBase64(samples, rate) {
  const bytes = new Uint8Array(44 + samples.length * 2), v = new DataView(bytes.buffer);
  const tag = (o, t) => { for (let i = 0; i < 4; i++) bytes[o + i] = t.charCodeAt(i); };
  tag(0, 'RIFF'); v.setUint32(4, 36 + samples.length * 2, true); tag(8, 'WAVE'); tag(12, 'fmt ');
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true); v.setUint32(24, rate, true);
  v.setUint32(28, rate * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true); tag(36, 'data'); v.setUint32(40, samples.length * 2, true);
  for (let i = 0; i < samples.length; i++) { const x = Math.max(-1, Math.min(1, samples[i])); v.setInt16(44 + i * 2, x < 0 ? x * 0x8000 : x * 0x7fff, true); }
  let str = '';
  for (let i = 0; i < bytes.length; i += 0x8000) str += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(str);
}

async function stageAudio(samples, rate, fromS, toS, tag) {
  const a = Math.floor(fromS * rate), b = Math.floor(toS * rate);
  const w = await callServerTool('write_file', { path: `audio/.cache/${tag}.wav`, content: wavBase64(samples.subarray(a, b), rate), encoding: 'base64' });
  if (w.error) throw new Error(w.error);
  return { path: w.path, offset_s: +fromS.toFixed(2), duration_s: +((b - a) / rate).toFixed(2) };
}

/* approvals for actions with side effects */
function needsApproval(name, args) {
  const c = S.tools.confirm;
  if (name === 'delete_file') return c.deletes || (/^root:/.test(String(args.path || '')) && c.outsideWrites !== false);
  if (name === 'write_file') return c.writes || (/root:/.test(String(args.path || '')) && c.outsideWrites !== false);
  if (name === 'http_request') return c.nonGet && !['GET', 'HEAD', 'OPTIONS'].includes(String(args.method || 'GET').toUpperCase());
  if (name === 'crawl_site') return c.crawls;
  if (name === 'generate_image') return c.images;
  if (name === 'generate_video') return c.videos;
  if (name === 'transcribe_audio' || name === 'listen_to_audio') return c.audio;
  if (name === 'run_javascript' || name === 'run_code') return c.js;
  if (name === 'run_command') return c.commands;
  if (name === 'mcp_call') return c.mcp;
  if (name === 'github_api') return c.nonGet && !['GET', 'HEAD', 'OPTIONS'].includes(String(args.method || 'GET').toUpperCase());
  return false;
}
let pendingApproval = null;
function approve(name, args) {
  if (AUTO.running && S.auto.approvals === 'deny') { toast(`Autopilot auto-declined ${name}`); return Promise.resolve(false); }
  if (AUTO.running && S.auto.approvals === 'allow') return Promise.resolve(true);
  return new Promise(resolve => {
    pendingApproval = allow => { bg.remove(); pendingApproval = null; resolve(allow); };
    const bg = document.createElement('div'); bg.className = 'modal-bg';
    bg.innerHTML = `<div class="modal"><header><span>Allow GLM to run <code>${esc(name)}</code>?</span></header><pre>${esc(JSON.stringify(args, null, 2))}</pre>
      <div style="display:flex;gap:8px;justify-content:flex-end;padding:12px 16px;border-top:1px solid var(--border)"><button class="btn" data-a="deny">Deny</button><button class="btn primary" data-a="allow">Allow</button></div></div>`;
    bg.onclick = e => { const a = e.target.dataset.a; if (a) pendingApproval(a === 'allow'); };
    document.body.appendChild(bg);
    $('[data-a="allow"]', bg).focus();
  });
}
// In autopilot, optionally block anything that changes state on other websites.
function autopilotBlock(name, args) {
  if (AUTO.running && S.auto.readOnlyWeb && name === 'http_request' && !['GET', 'HEAD', 'OPTIONS'].includes(String(args.method || 'GET').toUpperCase()))
    return { error: 'Blocked: autopilot is in read-only web mode (no POST/PUT/PATCH/DELETE). Find a read-only way or move on.' };
}
async function guardedServerTool(name, args) {
  const blocked = autopilotBlock(name, args); if (blocked) return blocked;
  if (needsApproval(name, args) && !(await approve(name, args))) return { error: 'The user declined this action.' };
  const extra = name === 'http_request' ? { max_chars: S.web.maxChars, ...args, ...webOpts() } : args;
  return callServerTool(name, extra);
}

function activeTools() {
  if (!S.tools.enabled) return [];
  const list = [];
  for (const [k, on] of Object.entries(S.tools.builtins)) {
    if (!on || !BUILTINS[k]) continue;
    if (BUILTINS[k].needs && !caps[BUILTINS[k].needs]) continue;
    const def = { ...BUILTINS[k].def };
    // the model has no clock; give search a sense of "now" for queries like "this week"
    if (k === 'web_search') def.description += ` Today's date is ${new Date().toDateString()}.`;
    if (k === 'mcp_call') def.description += mcpSummary();
    list.push({ type: 'function', function: def });
  }
  for (const t of S.tools.custom) {
    if (!t.enabled || !t.name) continue;
    let params; try { params = JSON.parse(t.parameters || '{}'); } catch { params = { type: 'object', properties: {} }; }
    list.push({ type: 'function', function: { name: t.name, description: t.description, parameters: params } });
  }
  return list;
}

async function executeTool(call) {
  const name = call.function.name;
  let args = {};
  try { args = JSON.parse(call.function.arguments || '{}'); } catch { return { error: 'Arguments were not valid JSON: ' + call.function.arguments }; }
  try {
    if (BUILTINS[name] && S.tools.builtins[name]) {
      const blocked = autopilotBlock(name, args); if (blocked) return blocked;
      if (needsApproval(name, args) && !(await approve(name, args))) return { error: 'The user declined this action.' };
      return await BUILTINS[name].run(args);
    }
    const custom = S.tools.custom.find(t => t.name === name && t.enabled);
    if (custom) return await new Function('args', `"use strict"; return (async () => { ${custom.handler} })()`)(args);
    return { error: `No handler for tool "${name}"` };
  } catch (e) { return { error: e.message }; }
}

/* =========================================================
   API
   ========================================================= */
// Long runs pile up tool output. Trim the oldest big results (in the request only; the chat keeps
// everything) until the conversation fits the budget. The latest messages are never touched.
function trimContext(messages) {
  const budget = +S.contextChars || 400000;
  const size = m => (m.content?.length || 0) + (m.reasoning_content?.length || 0) + (m.tool_calls ? JSON.stringify(m.tool_calls).length : 0);
  let total = messages.reduce((a, m) => a + size(m), 0), trimmed = 0;
  const keep = messages.length - 8;
  for (let i = 1; i < keep && total > budget; i++) {
    if (messages[i].reasoning_content) { total -= messages[i].reasoning_content.length; delete messages[i].reasoning_content; trimmed++; }
  }
  for (const [role, limit] of [['tool', 1200], ['assistant', 1500], ['user', 3000]]) {
    for (let i = 1; i < keep && total > budget; i++) {
      const m = messages[i];
      if (m.role !== role || (m.content?.length || 0) <= limit + 200) continue;
      const cut = m.content.slice(0, limit) + `\n…[${m.content.length - limit} chars trimmed to fit context. Re-run the tool or read the saved file if you need it again.]`;
      total -= m.content.length - cut.length; m.content = cut; trimmed++;
    }
  }
  return trimmed;
}

function buildRequest(history, chat) {
  const messages = [];
  const system = [S.system.trim(), S.memory.enabled ? memoryPrompt() : '', chat?.autopilot ? autopilotPrompt(chat.autopilot) : ''].filter(Boolean).join('\n\n');
  if (system) messages.push({ role: 'system', content: system });
  // tool calls that never got a result (e.g. a cycle hit its round limit) would make the API reject the request
  const answered = new Set(history.filter(m => m.role === 'tool').map(m => m.tool_call_id));
  for (const m of history) {
    if (m.error || m.note) continue;
    if (m.role === 'user') messages.push({ role: 'user', content: m.content + (m.autoNote ? '\n\n' + m.autoNote : '') });
    else if (m.role === 'assistant') {
      const o = { role: 'assistant', content: m.content || '' };
      const calls = (m.tool_calls || []).filter(t => answered.has(t.id));
      // send its own earlier thinking back so it stays consistent with what it decided
      if (S.memory.keepReasoning && m.reasoning) o.reasoning_content = m.reasoning;
      if (calls.length) o.tool_calls = calls.map(({ id, type, function: f }) => ({ id, type, function: f }));
      if (!o.content && !calls.length) continue;
      messages.push(o);
    } else if (m.role === 'tool') messages.push({ role: 'tool', tool_call_id: m.tool_call_id, content: m.content });
  }
  const body = { model: S.model, messages, stream: S.stream, temperature: +S.temperature, top_p: +S.top_p, thinking: { type: S.thinking ? 'enabled' : 'disabled', ...(S.thinking && S.memory.keepReasoning ? { clear_thinking: false } : {}) } };
  if (S.max_tokens) body.max_tokens = +S.max_tokens;
  const stops = S.stop.split(',').map(s => s.trim()).filter(Boolean);
  if (stops.length) body.stop = stops;
  if (S.jsonMode) body.response_format = { type: 'json_object' };
  const tools = activeTools();
  if (tools.length) { body.tools = tools; body.tool_choice = S.tools.toolChoice; }
  try { Object.assign(body, JSON.parse(S.extra || '{}')); } catch {}
  buildRequest.trimmed = trimContext(body.messages);
  return body;
}

async function callModel(chat, msg) {
  const body = buildRequest(chat.messages.slice(0, chat.messages.indexOf(msg)), chat);
  if (buildRequest.trimmed) msg.meta.trimmed = buildRequest.trimmed;
  const log = { request: body, raw: [] };
  requestLog.set(msg.id, log);
  // each entry holds a full request body; keep only recent ones so long runs don't eat memory
  while (requestLog.size > 25) requestLog.delete(requestLog.keys().next().value);
  const t0 = performance.now(); let tFirst = null, tThinkEnd = null;
  abortCtl = new AbortController();
  const res = await fetch('/api/chat', { method: 'POST', headers: { ...API_HEADERS, 'X-Endpoint': S.endpoint }, body: JSON.stringify(body), signal: abortCtl.signal });
  const ctype = res.headers.get('content-type') || '';
  if (!res.ok || !ctype.includes('event-stream')) {
    const j = await res.json().catch(() => ({ error: { message: `HTTP ${res.status}` } }));
    log.raw.push(j);
    if (j.error || !res.ok) throw new Error(`${j.error?.code ? '[' + j.error.code + '] ' : ''}${j.error?.message || 'HTTP ' + res.status}`);
    const m = j.choices?.[0]?.message || {};
    msg.content = m.content || ''; msg.reasoning = m.reasoning_content || '';
    msg.tool_calls = m.tool_calls || [];
    msg.meta.finish = j.choices?.[0]?.finish_reason; msg.meta.usage = j.usage;
    msg.meta.total = (performance.now() - t0) / 1000;
    return;
  }
  const reader = res.body.getReader(); const dec = new TextDecoder(); let buf = '';
  const tick = rafThrottle(() => renderStreaming(msg));
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });
    let i;
    while ((i = buf.indexOf('\n')) >= 0) {
      const line = buf.slice(0, i).trim(); buf = buf.slice(i + 1);
      if (!line.startsWith('data:')) continue;
      const d = line.slice(5).trim();
      if (d === '[DONE]') continue;
      let j; try { j = JSON.parse(d); } catch { continue; }
      log.raw.push(j);
      if (j.error) throw new Error(j.error.message || JSON.stringify(j.error));
      const ch = j.choices?.[0]; const delta = ch?.delta || {};
      if (delta.reasoning_content) { tFirst ??= performance.now(); msg.reasoning += delta.reasoning_content; }
      if (delta.content) { tFirst ??= performance.now(); if (msg.reasoning && !tThinkEnd) tThinkEnd = performance.now(); msg.content += delta.content; }
      for (const tc of delta.tool_calls || []) {
        tFirst ??= performance.now();
        const idx = tc.index ?? msg.tool_calls.length;
        const t = msg.tool_calls[idx] ||= { id: '', type: 'function', function: { name: '', arguments: '' } };
        if (tc.id) t.id = tc.id;
        if (tc.function?.name) t.function.name = t.function.name && t.function.name !== tc.function.name ? t.function.name + tc.function.name : tc.function.name;
        if (tc.function?.arguments) t.function.arguments += tc.function.arguments;
      }
      if (ch?.finish_reason) msg.meta.finish = ch.finish_reason;
      if (j.usage) msg.meta.usage = j.usage;
      tick();
    }
  }
  const end = performance.now();
  msg.meta.ttft = tFirst ? (tFirst - t0) / 1000 : null;
  msg.meta.total = (end - t0) / 1000;
  if (tThinkEnd && tFirst) msg.meta.thinkTime = (tThinkEnd - tFirst) / 1000;
  const out = msg.meta.usage?.completion_tokens;
  // if output arrived in one burst, fall back to total time so the rate isn't absurd
  if (out) msg.meta.tps = out / ((tFirst && end - tFirst > 300 ? end - tFirst : end - t0) / 1000);
}

function rafThrottle(fn) { let q = false; return () => { if (q) return; q = true; requestAnimationFrame(() => { q = false; fn(); }); }; }

async function runTurn(chat, round = 0, maxRounds = S.tools.maxRounds) {
  // mid-cycle during autopilot: hand GLM anything you typed right away instead of waiting for the next cycle
  if (AUTO.running && round > 0 && AUTO.inbox.length) {
    chat.messages.push({ id: uid(), role: 'user', content: AUTO.inbox.splice(0).join('\n\n') });
    updateAutoBar();
  }
  const msg = { id: uid(), role: 'assistant', content: '', reasoning: '', tool_calls: [], meta: { model: S.model } };
  chat.messages.push(msg);
  renderMessages(); setBusy(true);
  try {
    await callModel(chat, msg);
  } catch (e) {
    if (e.name === 'AbortError') msg.meta.stopped = true;
    else { msg.error = e.message; }
  } finally {
    msg.tool_calls = msg.tool_calls.filter(Boolean);
    chat.updated = Date.now(); saveChats();
  }
  renderMessages();
  if (!msg.error && !msg.meta.stopped && msg.tool_calls.length) {
    if ((S.tools.autoRun || AUTO.running) && round < maxRounds) {
      await runToolCalls(chat, msg);
      return runTurn(chat, round + 1, maxRounds);
    }
    if (round >= maxRounds && !AUTO.running) toast(`Stopped after ${maxRounds} tool rounds`);
  }
  setBusy(false);
  renderMessages(); // drop the streaming cursor
}

async function runToolCalls(chat, msg) {
  for (const call of msg.tool_calls) {
    if (chat.messages.some(m => m.role === 'tool' && m.tool_call_id === call.id)) continue;
    setStatus(`Running ${call.function.name}…`);
    const t0 = performance.now();
    const result = await executeTool(call);
    chat.messages.push({ id: uid(), role: 'tool', tool_call_id: call.id, name: call.function.name, content: typeof result === 'string' ? result : JSON.stringify(result, null, 2), meta: { ms: performance.now() - t0, error: !!result?.error } });
    renderMessages(); saveChats();
    if (activeTab === 'files' && !$('#panel').classList.contains('hidden')) loadFileTree();
  }
  setStatus('');
}

/* =========================================================
   Autopilot: GLM runs on its own in cycles
   ========================================================= */
const AUTO_PROMPT_DEFAULT = `## AUTOPILOT MODE
You are running autonomously. No human is watching in real time; the user will review your work later. Messages starting with [Autopilot] are automatic ticks, not a person: keep going on your own. Any other user message is the real user stepping in, so prioritize it.

Mission: {mission}

How to work:
- First cycle: read autopilot/journal.md if it exists (your memory from earlier runs), then state a concrete plan.
- Every cycle, make real progress with your tools. Don't just describe what you'll do. Do it.
- Save your work in the files sandbox under autopilot/<project-name>/. Append a short dated entry to autopilot/journal.md each cycle: what you did, what you learned, what's next.
- End each cycle with a two-line status: "DONE:" and "NEXT:".
- {finish_rule}

Limits:
- {web_rule}
- Never sign up for accounts, log in, post or comment publicly, message people, or buy anything.
- Respect robots.txt and rate limits. Don't crawl or fetch more than you need.
- Never try to get around CAPTCHAs, paywalls, or access controls.
- If an action is declined or blocked, adapt and move on.
- {budget}`;
const FREE_MISSION = 'Your choice. You have free time, a sandbox, and real tools. Pick something you find genuinely interesting or useful (research a question in depth, investigate something on the web, build a small program or dataset, write something) and pursue it properly. You may change direction if something better comes up.';

function autopilotPrompt(a) {
  return (S.auto.prompt || AUTO_PROMPT_DEFAULT)
    .replaceAll('{mission}', a.goal || FREE_MISSION)
    .replaceAll('{web_rule}', a.readOnlyWeb ? 'You are read-only on the web: GET requests only. POST/PUT/PATCH/DELETE are blocked.' : 'Prefer read-only web access. Only send data to a site when the mission clearly needs it.')
    .replaceAll('{finish_rule}', a.unlimited
      ? 'There is no finish line. When a project is done, summarize it in the journal and start the next worthwhile one. Only put AUTOPILOT_DONE on its own line if the mission has a clear end and it is fully complete.'
      : 'When the mission is complete, or you truly have nothing worthwhile left, write a final summary to the journal and put AUTOPILOT_DONE on its own line.')
    .replaceAll('{budget}', a.unlimited ? 'Budget: unlimited. You run until the user stops you, so pace yourself and keep the work high quality.' : `Budget: ${a.maxCycles} cycles, ${a.minutes} minutes.`)
    .replaceAll('{max_cycles}', a.unlimited ? 'unlimited' : a.maxCycles).replaceAll('{minutes}', a.unlimited ? 'unlimited' : a.minutes);
}

const AUTO = { running: false, paused: false, stop: false, chat: null, cycle: 0, started: 0, deadline: 0, inbox: [], phase: '', wakeLock: null, timer: null };

function autoTokens() {
  return (AUTO.chat?.messages || []).filter(m => m.role === 'assistant' && m.meta?.at >= AUTO.started)
    .reduce((a, m) => a + (m.meta.usage?.total_tokens || 0), 0);
}
function updateAutoBar() {
  const bar = $('#autoBar');
  bar.hidden = !AUTO.running;
  $('#autoChip').classList.toggle('on', AUTO.running);
  $('#autoChip').textContent = AUTO.running ? `🤖 ${AUTO.cycle}/${S.auto.unlimited ? '∞' : S.auto.maxCycles}` : '🤖 Autopilot';
  if (!AUTO.running) return;
  bar.classList.toggle('paused', AUTO.paused);
  $('#autoPause').textContent = AUTO.paused ? 'Resume' : 'Pause';
  const tok = autoTokens();
  const elapsed = Math.round((Date.now() - AUTO.started) / 60000);
  $('#autoStatus').textContent = [
    S.auto.unlimited ? `cycle ${AUTO.cycle} · no limit · ${elapsed} min running` : `cycle ${AUTO.cycle}/${S.auto.maxCycles} · ${Math.max(0, Math.round((AUTO.deadline - Date.now()) / 60000))} min left`, tok ? `${(tok / 1000).toFixed(1)}k tokens` : '',
    AUTO.paused ? 'paused' : AUTO.phase, AUTO.inbox.length ? `${AUTO.inbox.length} message${AUTO.inbox.length > 1 ? 's' : ''} queued` : '',
  ].filter(Boolean).join(' · ');
}

// Sleep in small steps so Stop / Pause / new messages take effect quickly.
async function autoSleep(ms, label) {
  const end = Date.now() + ms;
  while (!AUTO.stop && (AUTO.paused || Date.now() < end)) {
    if (!AUTO.paused && AUTO.inbox.length) break;
    AUTO.phase = AUTO.paused ? '' : `${label} ${Math.ceil((end - Date.now()) / 1000)}s`;
    updateAutoBar();
    await new Promise(r => setTimeout(r, 400));
  }
}

async function runAutopilot(cfg) {
  if (AUTO.running || busy) return;
  Object.assign(S.auto, cfg); S.tools.enabled = true; saveSettings(); renderHeader();
  let chat = cur();
  if (cfg.newChat || !chat) {
    newChat(); chat = cur();
    chat.title = '🤖 ' + (cfg.goal ? cfg.goal.replace(/\s+/g, ' ').slice(0, 40) : 'Free roam') + ' · ' + new Date().toLocaleDateString();
  }
  chat.autopilot = { goal: cfg.goal, unlimited: cfg.unlimited, maxCycles: cfg.maxCycles, minutes: cfg.minutes, readOnlyWeb: cfg.readOnlyWeb, startedAt: Date.now() };
  Object.assign(AUTO, { running: true, paused: false, stop: false, chat, cycle: 0, started: Date.now(), deadline: cfg.unlimited ? Infinity : Date.now() + cfg.minutes * 60000, inbox: [], phase: 'starting' });
  try { AUTO.wakeLock = await navigator.wakeLock?.request('screen'); } catch {}
  AUTO.timer = setInterval(updateAutoBar, 1000);
  document.title = '🤖 GLM Workspace';
  renderAll(); updateAutoBar();

  let reason = 'stopped', errors = 0;
  while (true) {
    if (AUTO.stop) { reason = 'you stopped it'; break; }
    if (!cfg.unlimited && AUTO.cycle >= cfg.maxCycles) { reason = `reached ${cfg.maxCycles} cycles`; break; }
    if (Date.now() > AUTO.deadline) { reason = `reached the ${cfg.minutes} min time limit`; break; }
    AUTO.cycle++;
    const minsLeft = Math.max(0, Math.round((AUTO.deadline - Date.now()) / 60000));
    const budget = cfg.unlimited ? `Cycle ${AUTO.cycle} · no limit` : `Cycle ${AUTO.cycle}/${cfg.maxCycles} · ${minsLeft} min left`;
    const tick = `[Autopilot] ${AUTO.cycle === 1 ? 'Start.' : 'Continue.'} ${budget} · ${new Date().toLocaleString()}.`;
    const inbox = AUTO.inbox.splice(0);
    if (inbox.length) chat.messages.push({ id: uid(), role: 'user', content: inbox.join('\n\n'), autoNote: tick });
    else chat.messages.push({ id: uid(), role: 'user', auto: true, content: tick });
    chat.updated = Date.now(); saveChats();
    if (currentId === chat.id) renderMessages();
    AUTO.phase = 'working'; updateAutoBar();

    const before = chat.messages.length;
    await runTurn(chat, 0, S.auto.roundsPerCycle);
    chat.messages.slice(before).forEach(m => { if (m.role === 'assistant') m.meta.at ??= Date.now(); });
    const last = [...chat.messages].reverse().find(m => m.role === 'assistant');

    if (last?.error) {
      // rate limits / quota: wait it out (longer in no-limit mode) instead of giving up
      errors++;
      const maxErrors = cfg.unlimited ? 10 : 3;
      if (errors >= maxErrors) { reason = `${maxErrors} errors in a row (${last.error})`; break; }
      const limited = /rate|limit|quota|1302|1303|1304|1305|1308|429|concurren/i.test(last.error);
      const wait = Math.min((limited ? 60000 : 30000) * 2 ** (errors - 1), cfg.unlimited ? 900000 : 300000);
      await autoSleep(wait, limited ? 'rate limited, retrying in' : 'error, retrying in');
      continue;
    }
    errors = 0;
    if (/^\s*AUTOPILOT_DONE\s*$/m.test(last?.content || '')) { reason = 'GLM says the mission is complete'; break; }
    await autoSleep(S.auto.pauseSec * 1000, 'next cycle in');
  }

  const tokens = autoTokens(), mins = ((Date.now() - AUTO.started) / 60000).toFixed(1);
  chat.messages.push({ id: uid(), role: 'user', note: true, content: `🤖 Autopilot finished: ${reason}. ${AUTO.cycle} cycles · ${mins} min · ${(tokens / 1000).toFixed(1)}k tokens` });
  chat.autopilot.endedAt = Date.now(); chat.autopilot.reason = reason;
  clearInterval(AUTO.timer);
  try { await AUTO.wakeLock?.release(); } catch {}
  Object.assign(AUTO, { running: false, paused: false, stop: false, phase: '', wakeLock: null });
  saveChats(); renderAll(); updateAutoBar();
  document.title = '✅ Autopilot done · GLM Workspace';
  toast(`Autopilot finished: ${reason}`);
}

function stopAutopilot() {
  if (!AUTO.running) return;
  AUTO.stop = true; AUTO.paused = false;
  abortCtl?.abort();
  pendingApproval?.(false);
  AUTO.phase = 'stopping'; updateAutoBar();
}

    const cfg = {
      unlimited: $('#apUnlimited', bg).checked,
      goal: $('#apGoal', bg).value.trim(), maxCycles: num('#apCycles', 20), minutes: num('#apMinutes', 30),
      pauseSec: Math.max(0, parseInt($('#apPause', bg).value, 10) || 0), roundsPerCycle: num('#apRounds', 10),
      approvals: $('#apApprovals', bg).value, readOnlyWeb: $('#apReadOnly', bg).checked, newChat: $('#apNewChat', bg).checked,
      prompt: prompt === AUTO_PROMPT_DEFAULT.trim() ? '' : prompt,
    };
    bg.remove();
    runAutopilot(cfg);
  };
  document.body.appendChild(bg);
  $('#apGoal', bg).focus();
}

/* =========================================================
   Actions
   ========================================================= */
function newChat() {
  const c = { id: uid(), title: 'New chat', messages: [], created: Date.now(), updated: Date.now() };
  chats.unshift(c); currentId = c.id; saveChats(); renderAll();
  $('#input').focus();
}

async function send() {
  if (AUTO.running) {
    const text = $('#input').value.trim(); if (!text) return;
    AUTO.inbox.push(text); $('#input').value = ''; autosize(); updateEstimate(); refreshSendBtn();
    toast(busy ? 'GLM will read this at its next step' : 'Sending to GLM…');
    updateAutoBar(); return;
  }
  if (busy) return;
  let text = $('#input').value.trim();
  if (!text && !attachments.length) return;
  if (attachments.some(a => a.uploading)) { toast('Wait for uploads to finish'); return; }
  if (attachments.length) {
    text += (text ? '\n\n' : '') + attachments.map(a => a.text != null
      ? `**${a.name}**\n\`\`\`${a.ext}\n${a.text}\n\`\`\``
      : /^image\//.test(a.type)
        ? `🖼 Uploaded image: \`${a.path}\` (${a.type}, ${fmtBytes(a.size)}). Use look_at_image to see it.`
        : /^audio\//.test(a.type)
        ? `🎧 Uploaded audio: \`${a.path}\` (${a.type}, ${fmtBytes(a.size)}). Use transcribe_audio for the words and listen_to_audio for tone, music and sounds.`
        : /^video\//.test(a.type)
        ? `🎬 Uploaded video: \`${a.path}\` (${a.type}, ${fmtBytes(a.size)}). transcribe_audio and listen_to_audio work on its soundtrack.`
        : `📎 Uploaded file: \`${a.path}\` (${a.type}, ${fmtBytes(a.size)}). It's in your files sandbox. Use read_file (encoding "base64" for binary) or run_code to work with it.`).join('\n\n');
    attachments = []; renderAttachments();
  }
  if (!cur()) newChat();
  const chat = cur();
  chat.messages.push({ id: uid(), role: 'user', content: text });
  if (chat.title === 'New chat') chat.title = text.replace(/\s+/g, ' ').slice(0, 48);
  $('#input').value = ''; autosize(); updateEstimate();
  renderAll();
  await runTurn(chat);
}

async function continueToolsManually(msgId) {
  const chat = cur(); const msg = chat.messages.find(m => m.id === msgId);
  if (!msg || busy) return;
  setBusy(true);
  await runToolCalls(chat, msg);
  await runTurn(chat);
}

function regenerate(msgId) {
  if (busy) return;
  const chat = cur();
  let i = chat.messages.findIndex(m => m.id === msgId);
  // walk back to the user message that started this turn
  while (i > 0 && chat.messages[i - 1].role !== 'user') i--;
  chat.messages.splice(i);
  saveChats(); runTurn(chat);
}

function deleteMsg(msgId) {
  const chat = cur();
  const i = chat.messages.findIndex(m => m.id === msgId);
  const m = chat.messages[i];
  let n = 1;
  // deleting an assistant msg with tool calls also removes its tool results
  if (m.role === 'assistant') while (chat.messages[i + n]?.role === 'tool') n++;
  chat.messages.splice(i, n); saveChats(); renderMessages();
}

function editMsg(msgId) {
  if (busy) return;
  const el = $(`.msg[data-id="${msgId}"] .bubble`);
  const chat = cur(); const m = chat.messages.find(x => x.id === msgId);
  el.innerHTML = `<textarea class="edit-area">${esc(m.content)}</textarea>
    <div style="display:flex;gap:6px;margin-top:6px;justify-content:flex-end">
      <button class="btn sm" data-a="cancel">Cancel</button>
      ${m.role === 'user' ? '<button class="btn sm primary" data-a="resend">Save & resend</button>' : ''}
      <button class="btn sm" data-a="save">Save</button></div>`;
  const ta = $('textarea', el); ta.focus(); ta.style.height = ta.scrollHeight + 'px';
  el.onclick = e => {
    const a = e.target.dataset.a; if (!a) return;
    if (a === 'cancel') return renderMessages();
    m.content = ta.value;
    if (a === 'resend') { chat.messages.splice(chat.messages.indexOf(m) + 1); saveChats(); renderMessages(); runTurn(chat); }
    else { saveChats(); renderMessages(); }
  };
}

function showRaw(msgId) {
  const log = requestLog.get(msgId);
  const chat = cur(); const m = chat.messages.find(x => x.id === msgId);
  const content = log
    ? `// REQUEST\n${JSON.stringify(log.request, null, 2)}\n\n// RESPONSE (${log.raw.length} chunk${log.raw.length === 1 ? '' : 's'})\n${JSON.stringify(log.raw.length > 40 ? [...log.raw.slice(0, 20), `… ${log.raw.length - 40} chunks …`, ...log.raw.slice(-20)] : log.raw, null, 2)}`
    : `// Request log is kept in memory for this page session only.\n// Stored message:\n${JSON.stringify(m, null, 2)}`;
  modal('Raw request / response', content);
}

function modal(title, text) {
  const bg = document.createElement('div'); bg.className = 'modal-bg';
  bg.innerHTML = `<div class="modal"><header>${esc(title)}<span><button class="btn sm" data-a="copy">Copy</button> <button class="btn sm" data-a="close">Close</button></span></header><pre>${esc(text)}</pre></div>`;
  bg.onclick = e => {
    if (e.target === bg || e.target.dataset.a === 'close') bg.remove();
    if (e.target.dataset.a === 'copy') { navigator.clipboard.writeText(text); toast('Copied'); }
  };
  document.body.appendChild(bg);
}

function download(name, text, type = 'application/json') {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type }));
  a.download = name; a.click(); URL.revokeObjectURL(a.href);
}

function chatToMarkdown(c) {
  let md = `# ${c.title}\n\n_Model: ${S.model} · exported ${new Date().toLocaleString()}_\n\n`;
  if (S.system) md += `> **System:** ${S.system.replace(/\n/g, '\n> ')}\n\n`;
  for (const m of c.messages) {
    if (m.role === 'user') md += `## 🧑 User\n\n${m.content}\n\n`;
    else if (m.role === 'assistant') {
      md += `## 🤖 Assistant\n\n`;
      if (m.reasoning) md += `<details><summary>Thinking</summary>\n\n${m.reasoning}\n\n</details>\n\n`;
      md += (m.content || '') + '\n\n';
      for (const t of m.tool_calls || []) md += `🔧 \`${t.function.name}(${t.function.arguments})\`\n\n`;
    } else if (m.role === 'tool') md += `**Tool result (${m.name}):**\n\`\`\`json\n${m.content}\n\`\`\`\n\n`;
  }
  return md;
}

/* =========================================================
   Rendering
   ========================================================= */
marked.setOptions({ gfm: true, breaks: false });
function renderMd(text, el) {
  el.innerHTML = DOMPurify.sanitize(marked.parse(text || ''));
  $$('a[href]', el).forEach(a => { a.target = '_blank'; a.rel = 'noopener noreferrer'; });
  $$('pre code', el).forEach(code => {
    const pre = code.parentElement;
    const lang = (code.className.match(/language-(\S+)/) || [])[1];
    try { hljs.highlightElement(code); } catch {}
    if (lang) { pre.classList.add('has-lang'); pre.insertAdjacentHTML('afterbegin', `<span class="code-lang">${esc(lang)}</span>`); }
    const b = document.createElement('button'); b.className = 'copy-code'; b.textContent = 'Copy';
    b.onclick = () => { navigator.clipboard.writeText(code.innerText); b.textContent = 'Copied'; setTimeout(() => b.textContent = 'Copy', 1200); };
    pre.appendChild(b);
  });
  if (window.renderMathInElement) try {
    renderMathInElement(el, { delimiters: [{ left: '$$', right: '$$', display: true }, { left: '\\[', right: '\\]', display: true }, { left: '$', right: '$', display: false }, { left: '\\(', right: '\\)', display: false }], throwOnError: false });
  } catch {}
}

function metaLine(m) {
  if (!S.look.showMeta) return '';
  const p = [m.meta?.model];
  const u = m.meta?.usage;
  if (u) {
    p.push(`${u.prompt_tokens ?? '?'} in / ${u.completion_tokens ?? '?'} out`);
    const r = u.completion_tokens_details?.reasoning_tokens; if (r) p.push(`${r} reasoning`);
    const c = u.prompt_tokens_details?.cached_tokens; if (c) p.push(`${c} cached`);
  }
  if (m.meta?.tps) p.push(`${m.meta.tps.toFixed(1)} tok/s`);
  if (m.meta?.ttft != null) p.push(`TTFT ${m.meta.ttft.toFixed(2)}s`);
  if (m.meta?.total) p.push(`${m.meta.total.toFixed(1)}s total`);
  if (m.meta?.finish && m.meta.finish !== 'stop') p.push(`finish: ${m.meta.finish}`);
  if (m.meta?.stopped) p.push('stopped');
  if (m.meta?.trimmed) p.push(`${m.meta.trimmed} old msgs trimmed`);
  return p.filter(Boolean).join(' · ');
}

const fileUrl = p => '/files/' + p.split('/').map(encodeURIComponent).join('/');
const zipUrl = p => '/api/zip?path=' + encodeURIComponent(p);
function fmtBytes(n) { if (n == null) return ''; const u = ['B', 'KB', 'MB', 'GB']; let i = 0; while (n >= 1024 && i < 3) { n /= 1024; i++; } return (i ? n.toFixed(1) : n) + ' ' + u[i]; }

// Links to whatever a tool saved into the sandbox, plus an inline screenshot preview.
function fileLinksHTML(m) {
  let d; try { d = JSON.parse(m.content); } catch { return ''; }
  if (!d || typeof d !== 'object') return '';
  const items = [];
  if (d.saved_to) items.push(`<a href="${fileUrl(d.saved_to)}" target="_blank">📄 ${esc(d.saved_to)}</a> <a href="${fileUrl(d.saved_to)}?download" title="Download">⤓</a>`);
  if (m.name === 'write_file' && d.path) items.push(`<a href="${fileUrl(d.path)}" target="_blank">📄 ${esc(d.path)}</a> <a href="${fileUrl(d.path)}?download" title="Download">⤓</a>`);
  if (d.output_dir) items.push(`📁 ${esc(d.output_dir)} <a href="${zipUrl(d.output_dir)}">⤓ download .zip</a>`);
  if (['generate_video', 'video_status'].includes(m.name) && /\.(mp4|mov|webm)$/i.test(d.saved_to || '')) {
    items.push(`<video class="shot" src="${fileUrl(d.saved_to)}" ${d.thumbnail ? `poster="${fileUrl(d.thumbnail)}"` : ''} controls playsinline preload="metadata"></video>`);
  }
  if (['transcribe_audio', 'listen_to_audio'].includes(m.name) && /\.(mp3|wav|m4a|ogg|oga|flac|aac|webm)$/i.test(d.source || '')) {
    items.push(`🎧 <a href="${fileUrl(d.source)}" target="_blank">${esc(d.source)}</a><br><audio src="${fileUrl(d.source)}" controls preload="none" style="width:100%;margin-top:6px"></audio>`);
  }
  if (m.name === 'generate_image' && d.saved_to) items.push(`<a href="${fileUrl(d.saved_to)}" target="_blank"><img class="shot gen" src="${fileUrl(d.saved_to)}" alt="generated image"></a>`);
  if (m.name === 'look_at_image' && d.path && !d.error) items.push(`<a href="${fileUrl(d.path)}" target="_blank">👁 ${esc(d.path)}</a><br><a href="${fileUrl(d.path)}" target="_blank"><img class="shot" src="${fileUrl(d.path)}" alt="image"></a>`);
  if (d.screenshot_saved_to) items.push(`<a href="${fileUrl(d.screenshot_saved_to)}" target="_blank">🖼 ${esc(d.screenshot_saved_to)}</a><br><a href="${fileUrl(d.screenshot_saved_to)}" target="_blank"><img class="shot" src="${fileUrl(d.screenshot_saved_to)}" alt="screenshot"></a>`);
  return items.length ? `<div class="file-links">${items.join('<br>')}</div>` : '';
}

function searchResultsHTML(m) {
  let d; try { d = JSON.parse(m.content); } catch { return null; }
  if (!Array.isArray(d.results)) return null;
  const host = u => { try { return new URL(u).hostname.replace(/^www\./, ''); } catch { return ''; } };
  const items = d.results.map(r => `<li>
      ${r.url ? `<a href="${esc(r.url)}" target="_blank" rel="noopener noreferrer">${esc(r.title || r.url)}</a>` : `<span>${esc(r.title || '(untitled)')}</span>`}
      <span class="sr-site">${esc(r.site || host(r.url))}${r.date ? ' · ' + esc(r.date) : ''}</span>
      ${r.snippet ? `<div class="sr-snip">${esc(r.snippet.length > 240 ? r.snippet.slice(0, 240) + '…' : r.snippet)}</div>` : ''}</li>`).join('');
  return `<div class="msg tool" data-id="${m.id}"><details class="tool-card search-card"${S.look.expandSearch ? ' open' : ''}>
    <summary class="head">🌐 “${esc(d.query)}” <span class="badge ok">${d.results.length} results</span><span class="meta">${esc(d.provider || '')}${d.took_ms ? ' · ' + d.took_ms + 'ms' : ''}</span></summary>
    <ol class="sr-list">${items || '<li class="sr-snip">No results.</li>'}</ol></details></div>`;
}

function toolCallCards(m, chat) {
  return (m.tool_calls || []).map(tc => {
    let args = tc.function.arguments; try { args = JSON.stringify(JSON.parse(args), null, 2); } catch {}
    const answered = chat.messages.some(x => x.role === 'tool' && x.tool_call_id === tc.id);
    const pending = !answered && !busy && m.meta?.finish === 'tool_calls';
    return `<div class="tool-card"><div class="head">${tc.function.name === 'web_search' ? '🌐' : '🔧'} ${esc(tc.function.name)} <span class="badge">call</span></div><pre>${esc(args)}</pre>
      ${pending ? `<div class="pending-actions"><button class="btn sm primary" data-act="runtools" data-id="${m.id}">Run tools & continue</button></div>` : ''}</div>`;
  }).join('');
}

function msgHTML(m, chat, isLast) {
  const actions = (list) => `<div class="actions">${list}<span class="meta">${esc(metaLine(m))}</span></div>`;
  const btn = (act, label, title) => `<button class="icon-btn" data-act="${act}" data-id="${m.id}" title="${title}">${label}</button>`;
  if (m.note || m.auto) {
    return `<div class="msg auto-tick" data-id="${m.id}"><div class="tick${m.note ? ' end' : ''}">${esc(m.note ? m.content : '🤖 ' + m.content.split('\n')[0].replace(/^\[Autopilot\]\s*/, ''))}</div></div>`;
  }
  if (m.role === 'user') {
    return `<div class="msg user${isLast ? ' last' : ''}" data-id="${m.id}"><div class="bubble">${esc(m.content)}</div>
      ${m.autoNote ? `<div class="tick">🤖 ${esc(m.autoNote.split('\n')[0].replace(/^\[Autopilot\]\s*/, ''))}</div>` : ''}
      ${actions(btn('copy', '⧉', 'Copy') + btn('edit', '✎', 'Edit') + btn('delete', '🗑', 'Delete'))}</div>`;
  }
  if (m.role === 'tool' && m.name === 'web_search') {
    const html = searchResultsHTML(m);
    if (html) return html;
  }
  if (m.role === 'tool') {
    return `<div class="msg tool" data-id="${m.id}"><div class="tool-card"><div class="head">↳ ${esc(m.name)} <span class="badge ${m.meta?.error ? 'err' : 'ok'}">${m.meta?.error ? 'error' : 'result'}</span><span class="meta">${m.meta?.ms ? m.meta.ms.toFixed(0) + 'ms' : ''}</span></div>${fileLinksHTML(m)}<pre>${esc(m.content)}</pre></div></div>`;
  }
  const reasoning = m.reasoning && S.look.showReasoning
    ? `<details class="reasoning"><summary>💭 ${m.content || m.tool_calls?.length ? `Thought${m.meta?.thinkTime ? ` for ${m.meta.thinkTime.toFixed(1)}s` : ''}` : 'Thinking…'}</summary><div class="md r"></div></details>` : '';
  return `<div class="msg assistant${isLast ? ' last' : ''}" data-id="${m.id}">
    <div class="bubble">${reasoning}<div class="md c"></div><div class="tc">${toolCallCards(m, chat)}</div>
    ${m.error ? `<div class="error-box">⚠ ${esc(m.error)}</div>` : ''}</div>
    ${actions(btn('copy', '⧉', 'Copy') + btn('edit', '✎', 'Edit') + btn('regen', '↻', 'Regenerate') + btn('raw', '{ }', 'Raw request/response') + btn('delete', '🗑', 'Delete'))}</div>`;
}

function renderMessages() {
  const chat = cur(); const inner = $('#messagesInner');
  if (!chat || !chat.messages.length) {
    inner.innerHTML = `<div class="empty"><h2>What should we test?</h2><div>${esc(S.model)} · ${S.endpoint === 'coding' ? 'Coding Plan' : 'Standard'} endpoint${S.thinking ? ' · thinking on' : ''}${S.tools.enabled ? ' · tools on' : ''}</div>
      <div class="starters">${STARTERS.map((s, i) => `<div class="starter" data-starter="${i}"><b>${s.t}</b>${esc(s.d)}</div>`).join('')}</div></div>`;
    return;
  }
  const atBottom = isNearBottom();
  inner.innerHTML = chat.messages.map((m, i) => msgHTML(m, chat, i === chat.messages.length - 1)).join('');
  chat.messages.forEach(m => {
    if (m.role !== 'assistant') return;
    const el = $(`.msg[data-id="${m.id}"]`);
    const c = $('.md.c', el); renderMd(m.content, c);
    const r = $('.md.r', el); if (r) renderMd(m.reasoning, r);
    if (busy && m === chat.messages.at(-1)) { (m.content ? c : r || c).classList.add('cursor'); if (r && !m.content) r.parentElement.open = true; }
  });
  if (atBottom || busy) scrollBottom();
}

function renderStreaming(m) {
  const el = $(`.msg[data-id="${m.id}"]`); if (!el) return;
  const atBottom = isNearBottom();
  if (m.reasoning && S.look.showReasoning && !$('details.reasoning', el)) {
    $('.bubble', el).insertAdjacentHTML('afterbegin', `<details class="reasoning" open><summary>💭 Thinking…</summary><div class="md r"></div></details>`);
  }
  const r = $('.md.r', el), c = $('.md.c', el);
  if (r) {
    renderMd(m.reasoning, r); r.scrollTop = r.scrollHeight;
    if (m.content) { $('summary', el).textContent = '💭 Thought'; r.classList.remove('cursor'); }
    else r.classList.add('cursor');
  }
  renderMd(m.content, c); c.classList.toggle('cursor', !!m.content || !r);
  $('.tc', el).innerHTML = toolCallCards(m, cur());
  if (atBottom) scrollBottom();
}

const isNearBottom = () => { const b = $('#messages'); return b.scrollHeight - b.scrollTop - b.clientHeight < 120; };
const scrollBottom = () => { const b = $('#messages'); b.scrollTop = b.scrollHeight; };

function renderChatList() {
  const q = $('#search').value.toLowerCase();

    <button class="icon-btn" data-dup="${c.id}" title="Duplicate">⧉</button>
    <button class="icon-btn" data-del="${c.id}" title="Delete">✕</button></div>`).join('') || `<div class="meta" style="padding:10px">No chats</div>`;
}

function renderHeader() {
  const chat = cur();
  $('#chatTitle').textContent = chat?.title || 'New chat';

function renderAll() { renderChatList(); renderHeader(); renderMessages(); }

function setBusy(b) {

  else setStatus(S.thinking ? 'Thinking…' : 'Generating…');
}
const setStatus = t => { $('#statusLine').textContent = t; };

function renderAttachments() {
  $('#attachments').innerHTML = attachments.map((a, i) => `<span class="attachment">${a.text != null ? '📄' : '📦'} ${esc(a.name)} <span class="meta">${a.text != null ? (a.text.length / 1000).toFixed(1) + 'k chars' : a.uploading ? 'uploading…' : fmtBytes(a.size) + ' · saved to files'}</span><button class="icon-btn" data-rm="${i}" style="padding:0 2px">✕</button></span>`).join('');

/* =========================================================
   Settings panel
   ========================================================= */
function field(label, inner, help = '', right = '') {
  return `<div class="field"><div class="lbl"><span>${label}</span><span>${right}</span></div>${inner}${help ? `<div class="help">${help}</div>` : ''}</div>`;
}
function sw(key, label, sub = '') {
  const v = key.split('.').reduce((o, k) => o[k], S);
  return `<label class="switch-row"><span>${label}${sub ? `<small>${sub}</small>` : ''}</span><input type="checkbox" data-bind="${key}" ${v ? 'checked' : ''}></label>`;
}
function setPath(path, value) {
  const ks = path.split('.'); let o = S;
  for (const k of ks.slice(0, -1)) o = o[k];
  o[ks.at(-1)] = value;
}
