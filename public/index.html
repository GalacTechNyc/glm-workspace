function applyLook() {
  const L = S.look, r = document.documentElement;
  if (L.theme === 'system') r.removeAttribute('data-theme'); else r.dataset.theme = L.theme;
  r.style.setProperty('--accent', L.accent);
  r.style.setProperty('--font-size', L.fontSize + 'px');
  r.style.setProperty('--chat-width', L.width + 'px');
  r.style.setProperty('--radius', L.radius + 'px');
  r.style.setProperty('--font', { inter: "'Inter', system-ui, sans-serif", system: 'system-ui, -apple-system, sans-serif', serif: "'Source Serif 4', Georgia, serif", mono: "'JetBrains Mono', monospace" }[L.font]);
  document.body.classList.toggle('bubbles', L.bubbles);
  $('#custom-css').textContent = L.customCss;
}

async function loadFileTree() {
  const box = $('#fileTree'); if (!box) return;
  const [r, c] = await Promise.all([callServerTool('list_files', {}), callServerTool('capabilities', {})]).catch(() => [{ error: 'Server unreachable' }, caps]);
  caps = c;
  if (r.error) { box.textContent = r.error; return; }
  box.classList.remove('meta');
  box.innerHTML = r.files.length ? `<div class="meta" style="margin-bottom:6px">${r.count} items · ${fmtBytes(r.total_bytes)}</div>` + r.files.map(f => {
    const depth = f.path.split('/').length - 1, name = f.path.split('/').pop();
    const actions = f.type === 'dir'
      ? `<a class="icon-btn" href="${zipUrl(f.path)}" title="Download folder as .zip">⤓</a>`
      : `<a class="icon-btn" href="${fileUrl(f.path)}?download" title="Download">⤓</a>`;
    return `<div class="file-row" style="padding-left:${6 + depth * 14}px">
      <span class="fname">${f.type === 'dir' ? '📁 ' + esc(name) : `<a href="${fileUrl(f.path)}" target="_blank">📄 ${esc(name)}</a>`}</span>
      <span class="meta">${fmtBytes(f.size)}</span>${actions}<button class="icon-btn" data-fdel="${esc(f.path)}" title="Delete">🗑</button></div>`;
  }).join('') : '<div class="meta">Empty. Ask GLM to download, crawl or write something.</div>';
  const sb = $('#sessionsBox');
  if (sb) sb.innerHTML = caps.sessions?.length ? caps.sessions.map(esc).join(', ') + ' <button class="btn sm" id="clearSessions" style="margin-left:6px">Clear all</button>' : 'None yet. GLM creates one when it passes <code>session</code> to http_request.';
}

async function loadModels() {
  try {
    const r = await fetch('/api/models', { headers: { 'X-Endpoint': S.endpoint } });
    const j = await r.json();
    if (j.data?.length) { models = j.data.map(m => m.id).sort((a, b) => b.localeCompare(a, undefined, { numeric: true })); renderHeader(); if (activeTab === 'model') renderPanel(); }
  } catch {}
}

/* =========================================================
   Events
   ========================================================= */
$('#panelBody').addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.bind) {
    let v = t.type === 'checkbox' ? t.checked : t.type === 'range' || t.type === 'number' ? (t.value === '' ? '' : +t.value) : t.value;
    setPath(t.dataset.bind, v);
    if (t.dataset.bind === 'extra') { let ok = true; try { JSON.parse(v || '{}'); } catch { ok = false; } $('#extraOk').innerHTML = ok ? '<span style="color:var(--ok)">valid</span>' : '<span style="color:var(--danger)">invalid JSON</span>'; }
    if (t.type === 'range') { const lab = t.closest('.field')?.querySelector('.lbl span:last-child'); if (lab) lab.textContent = v + (t.dataset.bind.startsWith('look.') ? 'px' : ''); }
    if (t.dataset.bind === 'system') t.closest('.field').querySelector('.lbl span:last-child').textContent = v.length + ' chars';
    saveSettings(); applyLook(); renderHeader();
    if (t.type === 'checkbox' && t.dataset.bind.startsWith('look.')) renderMessages();
    if (t.dataset.bind === 'endpoint') loadModels();
    if (['thinking', 'tools.enabled'].includes(t.dataset.bind) && !cur()?.messages.length) renderMessages();
  }
  const tf = t.dataset.tf;
  if (tf) {
    const i = +t.closest('[data-tool]').dataset.tool;
    S.tools.custom[i][tf] = t.type === 'checkbox' ? t.checked : t.value;
    if (tf === 'parameters') { try { JSON.parse(t.value); t.style.borderColor = ''; } catch { t.style.borderColor = 'var(--danger)'; } }
    saveSettings();
  }
});
$('#panelBody').addEventListener('click', e => {
  const t = e.target;
  if (t.dataset.accent) { S.look.accent = t.dataset.accent; saveSettings(); applyLook(); renderPanel(); }
  if (t.dataset.preset) { S.system = S.presets[+t.dataset.preset].text; saveSettings(); renderPanel(); toast(`Loaded "${S.presets[+t.dataset.preset].name}"`); }
  if (t.dataset.tdel) { S.tools.custom.splice(+t.dataset.tdel, 1); saveSettings(); renderPanel(); }
  if (t.dataset.rtreset) { killSession(t.dataset.rtreset); renderPanel(); toast('Session reset'); }
  if (t.id === 'memAdd') {
    const text = $('#memNew').value.trim();
    if (text) callServerTool('remember', { text, source: 'user' }).then(r => { if (r.error) toast(r.error); refreshMemory(); });
  }
  const medit = t.closest('[data-medit]')?.dataset.medit;
  if (medit) {
    const m = memoryCache.find(x => x.id === medit);
    const text = m && prompt('Edit memory', m.text);
    if (text && text.trim() !== m.text) callServerTool('update_memory', { id: medit, text }).then(refreshMemory);
  }
  if (t.dataset.mdel) callServerTool('forget', { id: t.dataset.mdel }).then(refreshMemory);
  if (t.id === 'memExport') download('glm-memory.json', JSON.stringify(memoryCache, null, 2));
  if (t.id === 'memClear' && confirm('Delete all memories? This cannot be undone.')) callServerTool('memory_clear', {}).then(refreshMemory);
  if (t.id === 'filesRefresh') loadFileTree();
  if (t.id === 'filesUpload') $('#sandboxUpload').click();
  if (t.id === 'clearSessions') callServerTool('clear_sessions', {}).then(loadFileTree);
  const fdel = t.closest('[data-fdel]')?.dataset.fdel;
  if (fdel && confirm(`Delete ${fdel}?`)) callServerTool('delete_file', { path: fdel }).then(loadFileTree);
  if (t.id === 'addTool') { S.tools.custom.push({ id: uid(), enabled: true, name: 'my_tool', description: '', parameters: JSON.stringify({ type: 'object', properties: { input: { type: 'string' } }, required: ['input'] }, null, 2), handler: 'return { echo: args.input };' }); saveSettings(); renderPanel(); }
  if (t.id === 'savePreset') { const n = prompt('Preset name?'); if (n) { S.presets.push({ name: n, text: S.system }); saveSettings(); renderPanel(); } }
  if (t.id === 'clearSystem') { S.system = ''; saveSettings(); renderPanel(); }
  if (t.id === 'refreshModels') { e.preventDefault(); loadModels().then(() => toast('Models refreshed')); }
  if (t.id === 'exportSettings') download('glm-settings.json', JSON.stringify(S, null, 2));
  if (t.id === 'importSettings') { const f = $('#importFile'); f.dataset.mode = 'settings'; f.click(); }
  if (t.id === 'resetSettings' && confirm('Reset all settings to defaults? (Chats are kept.)')) { S = structuredClone(DEFAULTS); saveSettings(); applyLook(); renderAll(); renderPanel(); }
});
$('#panelBody').addEventListener('contextmenu', e => {
  const p = e.target.dataset.preset; if (p == null) return;
  e.preventDefault();
  if (confirm(`Delete preset "${S.presets[+p].name}"?`)) { S.presets.splice(+p, 1); saveSettings(); renderPanel(); }
});
$('#panelBody').addEventListener('change', async e => {
  if (e.target.id !== 'sandboxUpload') return;
  for (const f of e.target.files) {
    const b64 = await new Promise(res => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1] || ''); r.readAsDataURL(f); });
    const out = await callServerTool('write_file', { path: 'uploads/' + f.name, content: b64, encoding: 'base64' });
    toast(out.error ? `Upload failed: ${out.error}` : `Uploaded to ${out.path}`);
  }
  loadFileTree();
});
$$('.tab').forEach(t => t.onclick = () => { activeTab = t.dataset.tab; renderPanel(); });

$('#messagesInner').addEventListener('click', e => {
  const st = e.target.closest('[data-starter]');
  if (st) { $('#input').value = STARTERS[+st.dataset.starter].d; autosize(); updateEstimate(); $('#input').focus(); return; }
  const b = e.target.closest('[data-act]'); if (!b) return;
  const id = b.dataset.id, m = cur()?.messages.find(x => x.id === id);
  switch (b.dataset.act) {
    case 'copy': navigator.clipboard.writeText(m.content || ''); toast('Copied'); break;
    case 'edit': editMsg(id); break;
    case 'regen': regenerate(id); break;
    case 'delete': deleteMsg(id); break;
    case 'raw': showRaw(id); break;
    case 'runtools': continueToolsManually(id); break;
  }
});

$('#chatList').addEventListener('click', e => {
  const del = e.target.dataset.del, dup = e.target.dataset.dup;
  if (del) {
    e.stopPropagation();
    if (!confirm('Delete this chat?')) return;
    chats = chats.filter(c => c.id !== del);
    if (currentId === del) currentId = chats[0]?.id || null;
    saveChats(); renderAll(); return;
  }
  if (dup) {
    e.stopPropagation();
    const src = chats.find(c => c.id === dup);
    const c = { ...structuredClone(src), id: uid(), title: src.title + ' (copy)', created: Date.now() };
    c.messages.forEach(m => m.id = uid());
    chats.unshift(c); currentId = c.id; saveChats(); renderAll(); return;
  }
  const item = e.target.closest('[data-chat]');
  if (item && !busy) { currentId = item.dataset.chat; saveChats(); renderAll(); if (innerWidth < 900) $('#app').classList.add('no-sidebar'); }
});

$('#chatTitle').onclick = () => {
  const c = cur(); if (!c) return;
  const n = prompt('Rename chat', c.title);
  if (n) { c.title = n; saveChats(); renderAll(); }
};
$('#search').oninput = renderChatList;
$('#newChat').onclick = () => { if (!busy) newChat(); };
$('#toggleSidebar').onclick = () => $('#app').classList.toggle('no-sidebar');
$('#togglePanel').onclick = () => { $('#panel').classList.toggle('hidden'); renderPanel(); };
$('#modelQuick').onchange = e => { S.model = e.target.value; saveSettings(); if (activeTab === 'model') renderPanel(); if (!cur()?.messages.length) renderMessages(); };
$('#thinkChip').onclick = () => { S.thinking = !S.thinking; saveSettings(); renderHeader(); renderPanel(); if (!cur()?.messages.length) renderMessages(); };
$('#searchChip').onclick = () => {
  const on = !(S.tools.enabled && S.tools.builtins.web_search);
  S.tools.builtins.web_search = on;
  if (on) S.tools.enabled = true;
  saveSettings(); renderHeader(); renderPanel(); if (!cur()?.messages.length) renderMessages();
};
$('#autoChip').onclick = openAutopilotDialog;
$('#autoStop').onclick = stopAutopilot;
$('#autoPause').onclick = () => { AUTO.paused = !AUTO.paused; updateAutoBar(); };
$('#toolsChip').onclick = () => { S.tools.enabled = !S.tools.enabled; saveSettings(); renderHeader(); renderPanel(); if (!cur()?.messages.length) renderMessages(); };
$('#exportChat').onclick = () => { const c = cur(); if (c) download(c.title.replace(/[^\w\- ]/g, '').slice(0, 40) + '.md', chatToMarkdown(c), 'text/markdown'); };
$('#exportAllBtn').onclick = () => download('glm-chats.json', JSON.stringify(chats, null, 2));
$('#importBtn').onclick = () => { const f = $('#importFile'); f.dataset.mode = 'chats'; f.click(); };
$('#importFile').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  try {
    const data = JSON.parse(await f.text());
    if (e.target.dataset.mode === 'settings') { S = deepMerge(structuredClone(DEFAULTS), data); saveSettings(); applyLook(); renderAll(); renderPanel(); toast('Settings imported'); }
    else {
      const arr = Array.isArray(data) ? data : [data];
      const ids = new Set(chats.map(c => c.id));
      chats = [...arr.filter(c => c.id && c.messages && !ids.has(c.id)), ...chats];
      saveChats(); renderAll(); toast(`Imported ${arr.length} chat(s)`);
    }
  } catch (err) { toast('Import failed: ' + err.message); }
  e.target.value = '';
};

// While GLM is working the button is Stop, except in autopilot when you've typed something: then it queues it.
$('#sendBtn').onclick = () => (busy && !(AUTO.running && $('#input').value.trim())) ? abortCtl?.abort() : send();
function refreshSendBtn() {
  const queue = AUTO.running && $('#input').value.trim();
  const stop = busy && !queue;
  const s = $('#sendBtn');
  s.classList.toggle('stop', stop); s.innerHTML = stop ? '■' : '➤';
  s.title = stop ? 'Stop this step' : queue ? 'Send to GLM (read at its next step)' : 'Send';
}
$('#input').addEventListener('keydown', e => {
  if (e.key !== 'Enter' || e.isComposing) return;
  const mod = e.metaKey || e.ctrlKey;
  if ((S.look.enterSends && !e.shiftKey) || (!S.look.enterSends && mod)) { e.preventDefault(); send(); }
});
$('#input').addEventListener('input', () => { autosize(); updateEstimate(); refreshSendBtn(); });
$('#attachBtn').onclick = () => $('#fileInput').click();
// Small text files go inline in the message; anything else (PDFs, spreadsheets, images, zips,
// big text) is saved to files/uploads/ and the message tells GLM where to find it.
const INLINE_MAX = 2e6, UPLOAD_MAX = 100e6;
async function addFiles(fileList) {
  for (const f of fileList) {
    const name = f.name || `pasted-${Date.now()}.${(f.type.split('/')[1] || 'bin').replace(/[^\w]/g, '')}`;
    if (f.size > UPLOAD_MAX) { toast(`${name} is too big (100MB max)`); continue; }
    if (f.size <= INLINE_MAX && !/^(image|audio|video)\//.test(f.type)) {
      const text = await f.text();
      if (!/[\x00-\x08\x0E-\x1F]/.test(text.slice(0, 2000))) { attachments.push({ name, ext: name.split('.').pop(), text }); renderAttachments(); continue; }
    }
    const a = { name, size: f.size, type: f.type || 'unknown type', uploading: true };
    attachments.push(a); renderAttachments();
    const b64 = await new Promise(res => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1] || ''); r.readAsDataURL(f); });
    const out = await callServerTool('write_file', { path: 'uploads/' + name.replace(/[\/\\]/g, '_'), content: b64, encoding: 'base64' }).catch(e => ({ error: e.message }));
    if (out.error) { attachments.splice(attachments.indexOf(a), 1); toast(`Upload failed: ${out.error}`); }
    else { a.path = out.path; a.uploading = false; }
    renderAttachments();
    if (activeTab === 'files' && !$('#panel').classList.contains('hidden')) loadFileTree();
  }
}
$('#fileInput').onchange = async e => { await addFiles([...e.target.files]); e.target.value = ''; };
const composerEl = $('.composer');
composerEl.addEventListener('dragover', e => { if (e.dataTransfer.types.includes('Files')) { e.preventDefault(); composerEl.classList.add('drop'); } });
composerEl.addEventListener('dragleave', () => composerEl.classList.remove('drop'));
composerEl.addEventListener('drop', e => { if (!e.dataTransfer.files.length) return; e.preventDefault(); composerEl.classList.remove('drop'); addFiles([...e.dataTransfer.files]); });
$('#attachments').onclick = e => { if (e.target.dataset.rm != null) { attachments.splice(+e.target.dataset.rm, 1); renderAttachments(); } };
document.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); if (!busy) newChat(); }
  if (e.key === 'Escape') { $('.modal-bg')?.remove(); if (busy) abortCtl?.abort(); }
});
// paste text files / large text
$('#input').addEventListener('paste', async e => {
  const files = [...e.clipboardData.files];
  if (!files.length) return;
  e.preventDefault();
  addFiles(files);
});

/* =========================================================
   Boot
   ========================================================= */
(async () => {
  // one-time settings migration: add the Web agent preset for existing users
  if ((S.version || 1) < 2) {
    if (!S.presets.some(p => p.name === WEB_AGENT_PRESET.name)) S.presets.push(WEB_AGENT_PRESET);
    S.version = 2; saveSettings();
  }
  try {
    const serverChats = await (await fetch('/api/chats')).json();
    let onServer = true;
    if (Array.isArray(serverChats)) chats = serverChats;
    else if (chats.length) onServer = await flushChats(); // first run: move browser-stored chats to the server
    if (onServer) try { localStorage.removeItem('glm.chats'); } catch {}
  } catch { toast('Server unreachable — chats won\'t be saved'); }
  if (!cur()) { if (chats.length) currentId = chats[0].id; else newChat(); }
  if (innerWidth < 900) { $('#app').classList.add('no-sidebar'); $('#panel').classList.add('hidden'); }
  applyLook(); renderAll(); renderPanel(); loadModels();
  fetch('/api/search/providers').then(r => r.json()).then(p => { searchProviders = p; if (activeTab === 'tools') renderPanel(); }).catch(() => {});
  callServerTool('capabilities', {}).then(c => { caps = c; if (activeTab === 'tools') renderPanel(); }).catch(() => {});
  refreshMcp();
  refreshMemory();
  $('#input').focus();
})();
</script>
</body>
